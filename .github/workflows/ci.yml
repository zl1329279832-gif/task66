# ============================================================
#  CI — 前端构建 + 后端打包
#  任意一步失败即标红（fail-fast）
# ============================================================
name: CI Build

on:
  push:
    branches: [ main, master, develop, release/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Maven profile (local / staging / prod)'
        required: true
        default: 'staging'

env:
  # 手动触发时取输入值，否则默认 staging
  MVN_PROFILE: ${{ github.event.inputs.profile || 'staging' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # ── 检出代码 ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── JDK 8 + Maven ─────────────────────────
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # ── Node 16（Vue 2 + node-sass 需要） ─────
      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: tongchengshangmenweiliuxitong/src/main/resources/admin/admin/package-lock.json

      # ── 前端：安装依赖 + 构建 Vue Admin ────────
      - name: Frontend — npm ci
        working-directory: tongchengshangmenweiliuxitong/src/main/resources/admin/admin
        run: npm ci

      - name: Frontend — npm run build
        working-directory: tongchengshangmenweiliuxitong/src/main/resources/admin/admin
        run: npm run build

      # ── 后端：Maven 打包 ──────────────────────
      - name: Backend — mvn package
        working-directory: tongchengshangmenweiliuxitong
        run: mvn -B clean package -P${{ env.MVN_PROFILE }} -DskipTests=false

      # ── 产物上传（可选，便于部署） ─────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: tongchengshangmenweiliuxitong/target/*.jar
          retention-days: 7
