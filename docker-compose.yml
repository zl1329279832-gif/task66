# ============================================================
#  docker-compose — 一键启动应用 + MySQL
# ============================================================
version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: tongchengshangmenweiliuxitong
      MYSQL_USER: ${DB_USER:-tongcheng_staging}
      MYSQL_PASSWORD: ${DB_PASS:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MVN_PROFILE: staging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-tongcheng_staging}
      DB_PASS: ${DB_PASS:-changeme}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - upload_data:/data/upload
    depends_on:
      - db

volumes:
  db_data:
  upload_data:
